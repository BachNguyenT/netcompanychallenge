                  detail: OK
                  checkedAt: '2026-11-02T08:15:00Z'
                masterDataAgeMinutes: 1
                degradedMode: true
                maintenanceUntil: '2026-11-02T08:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/health:

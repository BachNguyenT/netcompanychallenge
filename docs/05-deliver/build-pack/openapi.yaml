openapi: 3.1.0
info:
  title: Order Intake Assistant API
  version: 1.0.0
  description: 'Contract for the complete product (R1, R2, R3). Roles: OH order handler, OL order-office lead, AD administrator, AN analyst. Source
    of truth: build-pack/openapi.yaml; changes after Step 12 go through _decisions.md.'
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.example.invalid
  description: placeholder; real hosts set in Step 25
security:
- bearerAuth: []
tags:
- name: EP-01 Intake
  description: 'Epic EP-01: Intake'
- name: EP-02 Matching
  description: 'Epic EP-02: Matching'
- name: EP-03 Review
  description: 'Epic EP-03: Review'
- name: EP-04 ERP
  description: 'Epic EP-04: ERP'
- name: EP-05 Learning
  description: 'Epic EP-05: Learning'
- name: EP-06 Operations
  description: 'Epic EP-06: Operations'
- name: EP-07 Platform
  description: 'Epic EP-07: Platform'
- name: EP-08 Administration
  description: 'Epic EP-08: Administration'
- name: EP-09 Markets
  description: 'Epic EP-09: Markets'
paths:
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Current user, roles and office scopes
      tags:
      - EP-07 Platform
      x-stories:
      - US-37
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                id: 00000000-0000-4000-8000-0000000000a1
                displayName: Mette Hansen
                email: mette.hansen@example.invalid
                roles:
                - OH
                officeIds:
                - 7a1d3c10-0000-4000-8000-000000000001
                marketCodes:
                - DK
                language: da
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/preferences:
    get:
      operationId: getMyPreferences
      summary: Notification and language preferences
      tags:
      - EP-06 Operations
      x-stories:
      - US-35
      - US-51
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              example:
                inApp: true
                email: true
                digestTime: tekst
                language: da
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: updateMyPreferences
      summary: Save notification and language preferences
      tags:
      - EP-06 Operations
      x-stories:
      - US-35
      - US-51
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      description: Own account only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
            example:
              inApp: true
              email: true
              digestTime: tekst
              language: da
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              example:
                inApp: true
                email: true
                digestTime: tekst
                language: da
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/onboarding:
    get:
      operationId: listOnboardingSteps
      summary: Onboarding checklist for the current user
      tags:
      - EP-08 Administration
      x-stories:
      - US-49
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      description: Progress is private to the user.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnboardingStep'
              example:
              - key: auto_approval
                title: Bekræft rekvisition
                done: true
                doneAt: '2026-11-02T08:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me/onboarding/{stepKey}/complete:
    post:
      operationId: completeOnboardingStep
      summary: Mark an onboarding step done
      tags:
      - EP-08 Administration
      x-stories:
      - US-49
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      parameters:
      - name: stepKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/feedback:
    post:
      operationId: submitFeedback
      summary: Send feedback and a usefulness rating
      tags:
      - EP-08 Administration
      x-stories:
      - US-50
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      description: Ratings reported as team aggregates only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
            example:
              rating: 1
              text: Fungerer fint.
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/notifications:
    get:

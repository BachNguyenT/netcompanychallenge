        OH: '-'
        OL: o
        AN: '-'
        AD: a
      description: Requires confirm=true; audited.
      parameters:
      - name: officeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeModeUpdate'
            example:
              mode: baseline
              confirm: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              example:
                id: d4a1c2e0-0000-4000-8000-000000000101

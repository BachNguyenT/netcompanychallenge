      - EP-06 Operations
      x-stories:
      - US-35
      - US-34
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      description: Own only; counts and links only.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOfNotification'
              example:
                items:
                - id: d4a1c2e0-0000-4000-8000-000000000101
                  kind: tekst
                  payload: {}
                  createdAt: '2026-11-02T08:15:00Z'
                  readAt: '2026-11-02T08:15:00Z'
                page: 1
                size: 1
                totalItems: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/status:
    get:
      operationId: getSystemStatus
      summary: Component health and maintenance notice
      tags:
      - EP-07 Platform
      x-stories:
      - US-43
      - US-44
      - US-51
      x-release: R1
      x-roles:
        OH: a
        OL: a
        AN: a
        AD: a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
              example:
                components:
                - component: erp_adapter
